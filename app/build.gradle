import com.android.build.api.variant.ApplicationAndroidComponentsExtension

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

/*
 * ---- Release 签名配置 ----
 *
 * 密钥库与口令**都不进版本库**（见 .gitignore）：签名密钥一旦公开，任何人都能
 * 伪造以本应用名义发布的更新，而 Android 只认签名、不认人。
 *
 * 所以这里从**仓库之外**读取，按优先级：release.properties（本机专属，已忽略）
 * → 环境变量（CI 用）。两者都读不到就**跳过 release 签名** —— 别人 clone 之后
 * `assembleRelease` 仍然能跑通（产物未签名），不会因为缺密钥而构建失败。
 */
def releasePropsFile = rootProject.file('release.properties')
def releaseProps = new Properties()
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}

def releaseStorePath = releaseProps.getProperty('storeFile') ?: System.getenv('ZHICODE_STORE_FILE')
def releaseStorePassword = releaseProps.getProperty('storePassword') ?: System.getenv('ZHICODE_STORE_PASSWORD')
def releaseKeyAlias = releaseProps.getProperty('keyAlias') ?: System.getenv('ZHICODE_KEY_ALIAS')
def releaseKeyPassword = releaseProps.getProperty('keyPassword') ?: System.getenv('ZHICODE_KEY_PASSWORD')

def releaseStoreFile = releaseStorePath ? rootProject.file(releaseStorePath) : null
def hasReleaseSigning = releaseStoreFile?.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

if (releaseStorePath && !releaseStoreFile?.exists()) {
    logger.warn("release.properties 指向的密钥库不存在：${releaseStoreFile}；release 产物将未签名")
}

android {
    namespace 'com.zhizhu.zhicode.compose'
    compileSdk 37

    defaultConfig {
        /*
         * 这里**不再有**"必须 8 个字符"的限制。
         *
         * 历史上确实有：内置 Termux bootstrap 里 337 个 ELF 把前缀
         * "/data/data/com.termux" 编译进了字符串表，而旧实现为了把前缀换成真实路径，
         * 对所有文件做**等长原地替换**——于是 13 + len(applicationId) 必须等于 21，
         * 包名被锁死在 8 个字符（原版选 "com.iqge" 正是这个原因）。
         *
         * 实测推翻了那个前提（扫描 zip 全部 3473 个文件）：
         *   含旧前缀的 611 个文件 = 114 个 #! 脚本 + 337 个 ELF + 160 个普通文本，
         *   而 337 个 ELF **全部且仅仅**把 "<prefix>/files/usr/lib" 放在 DT_RUNPATH 里
         *   （DT_RPATH 0 个、带路径的 DT_NEEDED 0 个、仅数据段 0 个）。
         *
         * DT_RUNPATH 只是库搜索提示，指向不存在的目录会被动态链接器跳过，
         * 并继续看 LD_LIBRARY_PATH。所以正确做法是：**ELF 一个字节都不动**，
         * 只改写文本（文本没有长度约束），库定位交给 LD_LIBRARY_PATH。
         *
         * 因此包名长度自由，这里用你要的 com.zhizhu.code。
         *
         * ⚠️ 随之而来的硬依赖：所有执行内置二进制的路径都必须设置
         *    LD_LIBRARY_PATH=<prefix>/lib
         * 见 TermuxShellExecutor 与 TermuxTerminalPane（旧代码在前者里刻意 remove 它，
         * 那是配合等长改写 RUNPATH 的旧设计，现已反转）。
         */
        applicationId 'com.zhizhu.code'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.2'

        // 内置 Termux 只提供 arm64 用户空间
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // 开启 BuildConfig：包名的**唯一真实来源**就是上面的 applicationId，
    // 代码里（TermuxConstants 的兜底值等）一律引用 BuildConfig.APPLICATION_ID，
    // 不再各自抄一份字符串。下次换包名只需改这一行。
    buildFeatures {
        compose true
        buildConfig true
    }

    // 解压后的 libtermux.so 要用绝对路径 System.load，必须按传统方式打进 APK
    packagingOptions {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/*.kotlin_module'] }
    }

    // bootstrap-aarch64.zip 不能被压缩：一是包体巨大，二是要按 32MB 原样读进 assets
    androidResources { noCompress 'zip' }

    lint { abortOnError false; checkReleaseBuilds false }

    /*
     * Release 签名。只在密钥库可用时声明 —— 见文件开头那段说明。
     *
     * ## 为什么是 v2，以及为什么关掉 v1
     *
     * 要求：release 用 **APK Signature Scheme v2**。
     *
     * v2 校验的是**整个 APK 文件**（而不只是 JAR 条目），因此能挡住 v1 时代那类
     * 「改一个字节仍能通过校验」的篡改；v1 是给 API 24 以前的老系统用的，
     * 而本工程 `minSdk 24`，**所有目标设备都支持 v2**，v1 只会多留一份可被
     * Janus 之类问题利用的旧式签名。所以 v1 关掉。
     *
     * v3 / v4 也显式关掉：
     *  - v3 是「密钥轮换」用的，现在用不到，留着会让产物多一份签名信息；
     *  - v4 会额外生成 `.idsig` 文件（增量安装用），发布物里不需要。
     * 将来若确实要轮换密钥，再把 v3 打开即可。
     */
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing false
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('未找到 release 密钥库，release 产物将**未签名**'
                        + '（把 release.properties 填好即可，见 README 的许可/发布一节）')
            }
            /*
             * R8：开混淆 + 开资源压缩。
             *
             * 本工程确实有反射与原生 hook（Bcore / black-reflection / Termux PTY），
             * 所以规则不能照抄模板，得逐条对着**真实调用点**写 —— 具体理由都在
             * app/proguard-rules.pro 里，每条规则前面都写了它挡的是什么。
             *
             * useProguard 的等价物（R8 的 full mode）由 AGP 自行决定，这里不瞎设；
             * 也不开 -dontoptimize，让 R8 正常做内联与裁剪，体积才是开 R8 的意义。
             */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// AGP 9 移除了 applicationVariants，改用 androidComponents API 定制输出文件名
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("ZhiCode-${variant.name}.apk")
        }
    }
}

/*
 * 这里曾经有一道"applicationId 必须恰好 8 个字符"的构建期守卫。
 * 它守卫的是一个**已被实测推翻**的前提（见 defaultConfig 里的说明）：
 * 旧实现对 bootstrap 里的 ELF 做等长前缀改写，所以包名长度被锁死。
 * 现在 ELF 原样不动、只改写文本，长度限制不复存在，守卫随之删除。
 */
def configuredApplicationId = android.defaultConfig.applicationId
if (configuredApplicationId == null || configuredApplicationId.isEmpty()) {
    throw new GradleException('app/build.gradle 未设置 applicationId。')
}

dependencies {
    // IQ 沙箱（BlackBox 虚拟 Android 运行时宿主）—— Phase 7
    implementation project(':Bcore')

    /*
     * Shizuku（https://github.com/RikkaApps/Shizuku）：无 Root 的 shell 身份。
     *
     * api 提供 `rikka.shizuku.Shizuku`（授权申请与状态查询），并**传递依赖**
     * `dev.rikka.shizuku:aidl` —— 后者才是 `moe.shizuku.server.IShizukuService`
     * 与 `IRemoteProcess` 的实现类（AIDL 生成的 Stub/Proxy）。
     * 少了 aidl 这一层，`newProcess` 根本无从调用：api 里的
     * `ShizukuRemoteProcess` 构造器是包级私有的，只能由 `IRemoteProcess` 构造。
     *
     * provider 提供 `rikka.shizuku.ShizukuProvider`：管理端通过它把 shell 服务的
     * Binder 递给我们，必须在清单里声明同名条目才生效。
     */
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.activity:activity-compose:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-core:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-shader:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-squircle:0.9.4'
    // 官方导航容器：整页之间的推入/弹出动效走它的 NavTransitions.MiuixDefault 预设
    // （新页全宽从右缘滑入 + 被覆盖页 1/4 视差与亮度衰减），返回方向自动反向。
    // 之前这些整页是各自 AnimatedVisibility 硬切，层级与动效都得手工维护。
    implementation 'top.yukonga.miuix.kmp:miuix-nav:0.9.4'
    // 模糊效果：独立 artifact，Android 需 API 33+（RuntimeShader），用 isRuntimeShaderSupported() 门控
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'

    /*
     * 基线配置文件（app/src/main/baseline-prof.txt）的**装机器**。
     *
     * 它现在会由 activity-compose 间接带进来，所以包体与行为上"不写也能用" ——
     * 但**不写就没人替它说话**：哪天 activity 的一次版本升级不再依赖它，
     * 打好的 assets/dexopt/baseline.prof 就会静静地留在包里没人安装，
     * 而首屏那几百毫秒的收益消失得毫无痕迹（profile 的收益本来就没人能"看出来"）。
     * 显式声明把这件事变成一处可检查的、明确的意图。
     *
     * 为什么需要它：API 26~27 没有系统级的 profile 安装流程，要靠这里注册的
     * Startup Initializer 在进程启动时把 baseline.prof 交给 ART；API 28+ 由系统自己处理。
     * 本工程 minSdk 是 24 —— 也就是说**最低支持的那几档系统正是最需要它的时候**。
     */
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'

    // 高性能增量代码编辑器：缩放、惯性滚动与 TextMate 语法分析。
    // LGPL-2.1，许可证与来源见 NOTICE。
    implementation 'io.github.rosemoe:editor:0.24.6'
    implementation 'io.github.rosemoe:language-textmate:0.24.6'

    // 原版引擎源码里用到了 androidx.annotation 的 @NonNull/@Nullable 等注解，仅编译期需要
    compileOnly 'androidx.annotation:annotation:1.8.1'

    /*
     * 真正的 JVM 单测依赖。
     *
     * app/tests/ 下那批是「文本级」断言：用 javac 直接编译、零依赖、只读源码字符串。
     * 它们能防「重写时漏掉一个分支」，但证明不了运行时行为 —— 而这正是重写 api/
     * 协议层最需要的东西（SSE 解析、档位映射这类逻辑，错一个小分支不会编译失败）。
     *
     * api/ 那一层是**完全没有 android.* import** 的纯 Java，所以可以直接在 JVM 上跑：
     * org.json 提供真实实现（不是 android.jar 里的抛异常桩），junit 提供断言框架。
     */
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
